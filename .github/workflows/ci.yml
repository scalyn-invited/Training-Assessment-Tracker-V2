name: Training Platform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  sqlite:
    name: PHP and SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_sqlite, zip
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: php vendor/bin/pint --test
      - run: php artisan test --compact
      - name: Verify synthetic mapping safeguards
        run: python3 -m unittest discover -s tests/Support -p test_client_mapping.py
      - run: php artisan view:cache
      - run: php scripts/restore-drill.php

  mariadb:
    name: MariaDB and concurrent workers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: training_foundation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_mysql, pdo_sqlite
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: php vendor/bin/phpunit -c phpunit.mariadb.xml --testdox

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_sqlite
          coverage: none
          ini-values: opcache.jit=off, opcache.jit_buffer_size=0
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Check navigation and UI tooling syntax
        run: |
          node --check public/navigation.js
          node --check public/client-palette.js
          node tests/Support/check-client-palettes.mjs
          node --check scripts/ui-prepare.mjs
          node --check scripts/ui-preview.mjs
      - name: Prepare isolated UI fixture
        run: node scripts/ui-prepare.mjs
      - name: Verify browser journeys and sidebar accessibility
        run: npx playwright test --config=playwright.ui.config.js
      - name: Prepare separate realistic demo fixture
        run: node scripts/realistic-demo.mjs --name=realistic-demo-browser --prepare
      - name: Extend isolated demo with fictional Global Admin
        run: node scripts/global-admin-demo.mjs --name=realistic-demo-browser --upgrade
      - name: Verify realistic demo journeys
        run: npx playwright test --config=playwright.demo.config.js
      - name: Verify assigned assessment journey
        env:
          TRAINING_BROWSER_PORT: '8127'
        run: |
          node --check public/assessment-draft.js
          node --check scripts/m3-browser-check.mjs
          node scripts/browser-prepare.mjs
          node scripts/m3-browser-check.mjs
      - name: Diagnose browser server failures
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then
            tail -n 100 storage/logs/laravel.log
          fi
      - name: Upload browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: |
            platform/playwright-report/
            platform/test-results/
            platform/.runtime/ui-sidebar/results/
            platform/.runtime/ui-sidebar/results.json
            platform/.runtime/ui-sidebar/*.png
            platform/.runtime/realistic-demo-evidence/browser.json
            platform/.runtime/realistic-demo-evidence/browser-results/
            platform/.runtime/m3-browser/
          retention-days: 7

  documents:
    name: Document parsing and OCR utilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCUMENT_REQUIRE_TOOLS: '1'
      DOCUMENT_PDFINFO: /usr/bin/pdfinfo
      DOCUMENT_PDFTOTEXT: /usr/bin/pdftotext
      DOCUMENT_PDFTOPPM: /usr/bin/pdftoppm
      DOCUMENT_TESSERACT: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.2'
          extensions: gd, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng clamav
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php vendor/bin/phpunit --filter='DocumentParserTest|DocumentExtractionTest|DocumentScannerTest' --testdox
